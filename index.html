<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCAMS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Floating Left Sidebar (Upload & Results) -->
        <div class="glass-panel sidebar" id="sidebar">
            <header class="header">
                <div class="header-top">
                    <h1>CALCAMS</h1>
                    <div class="theme-selector">
                        <button class="theme-btn active" data-theme="auto" title="System Theme">Auto</button>
                        <button class="theme-btn" data-theme="light" title="Light Theme">Light</button>
                        <button class="theme-btn" data-theme="dark" title="Dark Theme">Dark</button>
                    </div>
                </div>
                <p>Upload a GPX, KML or TXT route to calculate the safety corridor and AMS (Area Minimum Altitude) for each leg.</p>
            </header>

            <div class="upload-section">
                <label for="fileInput" class="upload-btn">
                    <span>Upload GPX, KML or TXT</span>
                    <input type="file" id="fileInput" accept=".gpx,.kml,.txt" style="display: none;">
                </label>
            </div>

            <!-- Route Summary & Leg Table -->
            <div class="results-section hidden" id="resultsSection">
                <div class="section-title">Route Legs & AMS</div>
                <div class="table-container">
                    <table id="legsTable">
                        <thead>
                            <tr>
                                <th>Leg</th>
                                <th>Max (ft)</th>
                                <th>Min (ft)</th>
                                <th>Var (ft)</th>
                                <th>AMS</th>
                            </tr>
                        </thead>
                        <tbody id="legsTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
                <button id="exportBtn" class="export-btn hidden">Export Calculated Route</button>
            </div>
            <footer class="footer">
                <div>v. 1.1.0</div>
                <div>Developed by FPT</div>
                <div class="footer-motto">FLECHA AO AR! À CAÇA! BRASIL!</div>
            </footer>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Floating Info Tooltip for Hovering/Clicking Map -->
        <div class="glass-panel info-panel" id="infoPanel">
            <div class="info-content">
                <div class="label">Elevation</div>
                <div class="value" id="elevationValue">-- m</div>
                <div class="coordinates" id="coordinatesValue">Lat: --, Lng: --</div>
                <div class="loading-spinner hidden" id="loadingSpinner"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Turf.js for Geospatial Buffer & Intersections -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <!-- Mapbox toGeoJSON for GPX/KML parsing -->
    <script src="https://cdn.jsdelivr.net/npm/@mapbox/togeojson@0.16.0/togeojson.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
